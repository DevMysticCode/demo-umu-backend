# gitleaks config — UMU backend
#
# Inherits the upstream default ruleset (covers AWS, Stripe, OpenAI,
# Anthropic, Google API keys, Postgres connection strings, JWTs, PEM
# private keys, etc.) and extends it with project-specific allowlists
# so we don't get drowned in false positives from seeded test data.
#
# Run locally:
#   gitleaks detect --source . --no-banner --config .gitleaks.toml
#
# Pre-commit hook (see .githooks/pre-commit in this repo) and CI both
# point at this config so a single source-of-truth governs all sweeps.

[extend]
useDefault = true

[allowlist]
description = "Project-wide allowlist for known-safe matches"

# Test fixtures + seed data + Prisma client output should never contain
# real secrets — but they do contain shapes that fire false positives
# (UUIDs that resemble JWTs, long random strings inside generated DTOs,
# the JWT payload we already rotated, etc.). Skip them.
paths = [
  '''^node_modules/''',
  '''^dist/''',
  '''^generated/''',
  '''^prisma/migrations/''',
  '''^prisma/seed.*\.ts$''',
  '''^src/scripts/seed-.*\.ts$''',
  '''(?i)\.lock$''',
  '''(?i)package-lock\.json$''',
]

# Known-safe placeholders + secrets that may still appear in archived
# git history snapshots; allowlist by value so the report is
# actionable, not noise.
regexTarget = "match"
regexes = [
  # Postgres password — rotated AND purged from history 2026-11-12
  # (git filter-repo + force-push to origin/main). Kept here only
  # because some clones/forks/mirrors still hold the pre-purge
  # history; safe to remove once those are confirmed gone too.
  '''XzjPlSFlOZFopOmHZKJmFFRaaiyBMbmX''',
  # Google Maps key — security/launch review 2026-11 (finding #3)
  # found this was NOT actually revoked despite the prior comment
  # here claiming it was: live-tested 2026-11-12, the key still
  # authenticates against Google's API (referer-restricted, so a
  # bare server-side request is rejected, but that does not confirm
  # it's scoped only to umovingu's own domains). Needs a real fix in
  # Google Cloud Console — restrict to umovingu's domains/APIs, or
  # rotate it outright — before this allowlist entry and the pending
  # history purge actually close the exposure out.
  '''AIzaSyA_lEpLKWJl6BS7rv2Fni3cR0NxuT8mGhk''',
  # User JWT from the leak (rotated via JWT_SECRET — same reason).
  '''eyJzdWIiOiJiYmY1N2MyNS1mYzM1LTQ3OTMtOTNiYy0yOTdkNTk1MGM5ZmUi''',
  # NestJS's own default README.md boilerplate (CircleCI badge markdown,
  # `?token=abc123def456`) — every fresh `nest new` scaffold ships this
  # literal placeholder token. Confirmed not a real secret; flagged as
  # generic-api-key purely on shape/entropy (security review 2026-09-22,
  # real gitleaks sweep — same false positive the manual regex sweep
  # already found and cleared).
  '''abc123def456''',
]

# Stop noisy patterns from triggering on real source. Generic
# "password" assignments in seed data, fixture JSON, and the like
# can be silenced with stopwords without weakening real detection.
stopwords = [
  "example",
  "placeholder",
  "your_key_here",
  "YOUR_IOS_CLIENT_ID",
  "demo-only-no-login",
  "apple-test@dev.local",
]
