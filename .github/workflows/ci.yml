name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Concurrency: cancel in-flight runs on the same branch when a new
# commit lands. Saves CI minutes when you push twice in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # secrets: scan working tree + diff for committed secrets.
  # Runs first because it's fast and a failure here means halt
  # everything else (don't waste minutes building a leaky tree).
  # ──────────────────────────────────────────────────────────────
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan everything, not just HEAD.
          fetch-depth: 0
      # Free OSS CLI instead of gitleaks/gitleaks-action@v2 — that action
      # now requires a paid GITLEAKS_LICENSE for any org-owned repo (this
      # one is under OpenProperty-umu), which just made the whole job
      # fail before it ever scanned anything. Same engine, same config,
      # no license needed.
      - name: install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
      - name: gitleaks
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  # ──────────────────────────────────────────────────────────────
  # build: install, prisma generate, compile, run any tests.
  # Builds against the committed lockfile (`npm ci`) so we catch
  # drift between package.json and package-lock.json.
  # ──────────────────────────────────────────────────────────────
  build:
    name: build & test
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install deps
        run: npm ci --ignore-scripts

      - name: prisma generate
        run: npx prisma generate

      - name: build
        run: npm run build

      - name: test
        run: npm test -- --passWithNoTests
        env:
          # Tests don't hit a real DB (Prisma + Stripe are stubbed) but
          # the validators and Stripe SDK instantiation need values.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-jwt-secret-at-least-sixteen-chars-please
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          NODE_ENV: test
